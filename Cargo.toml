[package]
name = "seabird-ham"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.41"
chrono-tz = "0.10.4"
futures = "0.3.31"
qrz-xml = "0.1.4"
regex = "1.11"
reqwest = { version = "0.12.23", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sd-notify = "0.4"
seabird = "0.4.0-alpha.4"
serde = { version = "1.0.219", features = ["derive"] }
serde-xml-rs = "0.8.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
